kind = "mobile"
previewPath = "/mobile/"
title = "Clarity — Mobile"
version = "1.0.0"
id = "artifacts/clarity-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 3001

[services.development]
run = "pnpm --filter @workspace/clarity-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clarity-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/clarity-mobile", "run", "serve" ]

[services.env]
PORT = "3001"
BASE_PATH = "/mobile/"
