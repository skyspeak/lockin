openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Clarity — voice-first action capture API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: capture
    description: Voice thought capture
  - name: actions
    description: Action queue management
  - name: followUpPlans
    description: Follow-up plans generated from actions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /capture:
    post:
      operationId: captureThought
      tags: [capture]
      summary: Transcribe a voice note, extract classified actions, and attach next steps
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Recorded voice note
      responses:
        "200":
          description: Transcript, extracted actions, and next steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResult"
        "400":
          description: Missing audio or empty transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported audio type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /actions:
    get:
      operationId: listActions
      tags: [actions]
      summary: List all actions for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ActionStatus"
        - name: includeSnoozed
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 100000
      responses:
        "200":
          description: List of actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Action"
                  total:
                    type: integer
                required: [actions, total]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAction
      tags: [actions]
      summary: Create a new action item for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActionBody"
      responses:
        "201":
          description: Action created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /actions/queue:
    get:
      operationId: getActionQueue
      tags: [actions]
      summary: Get the active action queue for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  queue:
                    type: array
                    items:
                      $ref: "#/components/schemas/Action"
                  snoozedCount:
                    type: integer
                  doneCount:
                    type: integer
                required: [queue, snoozedCount, doneCount]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /actions/{id}:
    put:
      operationId: updateAction
      tags: [actions]
      summary: Update an action owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActionBody"
      responses:
        "200":
          description: Updated action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAction
      tags: [actions]
      summary: Delete an action owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /actions/{id}/snooze:
    post:
      operationId: snoozeAction
      tags: [actions]
      summary: Snooze an action owned by the authenticated user for N days (default 7)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnoozeActionBody"
      responses:
        "200":
          description: Snoozed action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /follow-up-plans:
    get:
      operationId: listFollowUpPlans
      tags: [followUpPlans]
      summary: List follow-up plans for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 100000
      responses:
        "200":
          description: List of follow-up plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/FollowUpPlan"
                  total:
                    type: integer
                required: [plans, total]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /follow-up-plans/{id}:
    get:
      operationId: getFollowUpPlan
      tags: [followUpPlans]
      summary: Get a follow-up plan by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Follow-up plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUpPlan"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /follow-up-plans/{id}/todos/{todoId}:
    patch:
      operationId: toggleFollowUpTodo
      tags: [followUpPlans]
      summary: Toggle done state on a user todo in a follow-up plan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: todoId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleFollowUpTodoBody"
      responses:
        "200":
          description: Updated follow-up plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUpPlan"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    ActionStatus:
      type: string
      enum:
        - pending
        - in-progress
        - done
        - dismissed

    Priority:
      type: string
      enum:
        - low
        - medium
        - high

    ActionCategory:
      type: string
      enum:
        - work
        - family
        - hobbies
        - extracurriculars
        - other

    Action:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/ActionCategory"
        status:
          $ref: "#/components/schemas/ActionStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        thoughtId:
          type: integer
          nullable: true
        nextSteps:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 4
        snoozedUntil:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, title, category, status, priority, nextSteps, createdAt, updatedAt]

    CaptureResult:
      type: object
      properties:
        transcript:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
      required: [transcript, actions]

    CreateActionBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        category:
          $ref: "#/components/schemas/ActionCategory"
        priority:
          $ref: "#/components/schemas/Priority"
      required: [title]

    UpdateActionBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        category:
          $ref: "#/components/schemas/ActionCategory"
        status:
          $ref: "#/components/schemas/ActionStatus"
        priority:
          $ref: "#/components/schemas/Priority"

    SnoozeActionBody:
      type: object
      properties:
        days:
          type: integer
          default: 7
          minimum: 1
          maximum: 365

    FollowUpPlanStatus:
      type: string
      enum:
        - generating
        - ready
        - failed

    FollowUpTodo:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        done:
          type: boolean
      required: [id, text, done]

    FollowUpPlan:
      type: object
      properties:
        id:
          type: integer
        actionId:
          type: integer
        actionTitle:
          type: string
        userId:
          type: string
        status:
          $ref: "#/components/schemas/FollowUpPlanStatus"
        summary:
          type: string
          nullable: true
        steps:
          type: array
          items:
            type: string
        userTodos:
          type: array
          items:
            $ref: "#/components/schemas/FollowUpTodo"
        checkInHint:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, actionId, actionTitle, userId, status, steps, userTodos, createdAt, updatedAt]

    ToggleFollowUpTodoBody:
      type: object
      properties:
        done:
          type: boolean
      required: [done]
